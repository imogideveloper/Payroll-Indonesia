[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "payroll_indonesia"
authors = [{name = "IMOGI", email = "hello@imogi.tech"}]
description = "Payroll Indonesia - Modul Perhitungan BPJS & PPh 21 untuk ERPNext Indonesia"
requires-python = ">=3.10"
readme = "README.md"
version = "1.0.0"
dependencies = [
    "frappe>=15.0.0",
    "erpnext>=15.0.0",
    # Leaving pypika unpinned (previous fix) traded one conflict for
    # another: uv then couldn't tell which of two implicit resolutions to
    # use and failed with "conflicting URLs for package `pypika`" instead.
    # uv's own error names the exact commit frappe 15.123.0 now needs —
    # pin to that one explicitly so there is only one answer. Update this
    # if frappe's own pypika pin moves again.
    "PyPika @ git+https://github.com/frappe/pypika@7ef6e40215d46cd531e8c4e58650b84c11abbd04",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit"
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["payroll_indonesia"]
